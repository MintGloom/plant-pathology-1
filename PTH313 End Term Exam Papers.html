<title>PTH313 End Term Examination – Question Papers</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#17231d;--mute:#5b6b62;--line:#d9e2dc;--acc:#1f5c43;--accbg:#e3f1ea;--ok:#0f7a45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#17221c;--ink:#e6efe9;--mute:#9bb0a4;--line:#2a3a31;--acc:#6fd0a0;--accbg:#1b3328;--ok:#6fd0a0}}
html{scroll-padding-top:90px;color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Newsreader",Georgia,serif;font-weight:600;margin:0}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px}
.tabs button,.ans{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 16px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--card);border-color:var(--acc)}
.ans{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
.head{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:18px}
.head h1{font-size:1.7rem}.head p{margin:4px 0;color:var(--mute)}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:10px;font-weight:600}
.note{background:var(--accbg);border-radius:8px;padding:10px 14px;margin:14px 0;font-size:.95rem}
h2{font-size:1.3rem;margin:28px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.q{padding:12px 0;border-bottom:1px dashed var(--line)}
.q .t{display:flex;gap:10px}.q .n{font-weight:700;min-width:2.2em}
.opts{list-style:none;margin:8px 0 0 2.2em;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.opts li{padding:3px 8px;border-radius:6px}
.key{display:none;margin:8px 0 0 2.2em;padding:8px 12px;border-left:4px solid var(--ok);background:var(--accbg);border-radius:4px;font-size:.95rem}
.show .key{display:block}.show .opts li.c{background:var(--accbg);color:var(--ok);font-weight:600}
.marks{margin-left:auto;color:var(--mute);white-space:nowrap}
@media (max-width:600px){.opts{grid-template-columns:1fr}.sheet{padding:16px}}
@media print{header.top{display:none}.sheet{border:0}}
</style>

],sub:[
S("Describe the symptoms, favourable conditions and management of white rust of mustard.",10,"Symptoms: creamy-white raised pustules on leaves that coalesce; systemic infection with downy mildew causes swelling and distortion of stem and flowers (hypertrophy/hyperplasia) – ‘stag head’. Favourable: RH above 70%, 12–25 °C, intermittent rain. Management: resistant varieties, 3-year rotation, remove weeds and debris, Metalaxyl seed treatment 6 g/kg, spray Bordeaux mixture 8% or Dithane M-45 0.2% or Ridomil MZ 72 WP 2 kg/ha."),
S("Write the disease cycle and management of Sclerotinia stem rot.",10,"Pathogen survives as mycelium in plants and as sclerotia in plant parts, on soil surface or as seed contaminant. Sclerotia form apothecia in moist soil; ascospores infect petals, then stem. Symptoms: water-soaked lesions near crown, cottony growth, bleached stems, black sclerotia inside. Favourable: 90–95% RH, 18–25 °C. Management: crop rotation, clean seed, avoid dense stands and fields with past infection."),
S("Distinguish early leaf spot from late leaf spot of groundnut.",10,"Early (C. arachidicola): starts about 1 month after sowing; dark brown sub-circular spots on upper surface with yellow halo; mycelium without haustoria; sexual stage Mycosphaerella arachidis. Late (C. personata): starts about 2 months after sowing; black, rough, nearly circular spots mostly on lower surface; haustoria present; sexual stage M. berkeleyii. Both cause premature defoliation."),
S("Explain the symptoms, vector and management of sesame phyllody.",10,"Caused by phytoplasma. Vein clearing, flowers turn into green leafy structures (phylloid), sterile flowers, thick veins, stunting, reduced internodes, abnormal branching. Transmitted by jassids; survives on alternate hosts (toria, rapa, chickpea, Crotalaria, Trifolium, groundnut). Management: remove weed hosts and infected plants, spray Monocrotophos or Dimethoate 500 ml/ha, soil application of Thimet 10G (10 kg/ha) or Phorate 10G (11 kg/ha) at sowing."),
S("Write short notes on any two: (a) Club root (b) Bacterial black rot (c) Castor seedling blight.",10,"Club root: stunted plants, club-shaped root galls, yellowing and wilting; resting spores in soil; humid, moist soil; control by debris removal, solarisation, resistant varieties. Black rot: V-shaped yellowing, black veins, stem hollowing; seed- and soil-borne; hot water seed treatment 50 °C/30 min, 3-year rotation. Castor blight: dull green patches on cotyledons, rotting, seedling death; 20–25 °C, rainy weather; thiram/captan 4 g/kg, avoid ill-drained fields.")
]},

S("Explain the disease cycle of Sclerotinia sclerotiorum with a labelled sketch description.",10,"Sclerotia survive in soil through summer. In moist soil they produce apothecia that release ascospores during the growing season. Ascospores infect petals; infected petals fall onto stems and start infection under wet, humid conditions. Stem rot develops with white cottony growth; new sclerotia form inside stems and fall to soil. Sclerotia may also germinate directly to infect the stem base."),
S("Describe the symptoms and management of bacterial blight (black rot) of crucifers.",10,"Yellowing from leaf margin forming V-shaped area with base at midrib; black veins; midrib cracking; dark streaks on stem that girdle it; hollow stem; plant collapse. Survives in residue and seed; spreads by soil and irrigation water; warm humid climate. Management: mercuric chloride seed treatment 30 min, hot water 50 °C 30 min, 3-year rotation, strict sanitation."),
S("Give the morphology of Cercospora arachidicola and C. personata.",10,"C. arachidicola: intercellular mycelium without haustoria; conidiophores olivaceous/yellowish brown, short, 1–2 septate, geniculate, in clusters; conidia pale yellow, obclavate, often curved, 3–12 septate. C. personata: mycelium with haustoria; conidiophores long, continuous, geniculate, olive brown; conidia cylindrical/obclavate, short, 1–9 septate, mostly 3–4."),
S("Discuss the integrated management of leaf spots of groundnut.",10,"Remove and destroy infected debris; control weeds; treat seed with Carbendazim or Thiram 2 g/kg; spray Carbendazim 500 g or Mancozeb 2 kg or Chlorothalonil 2 kg/ha, repeat after 15 days if needed; grow moderately resistant varieties like ALR 1; avoid heavy N and P doses and correct magnesium deficiency; favourable conditions are 3 days high humidity, about 20 °C and leaf dew."),

M("Alternaria leaf spot of groundnut: A. arachidis and","A. tenuissima|A. helianthi|A. ricini|A. carthami",0),
M("Rust of sunflower is caused by","Puccinia helianthi|Puccinia arachidis|Melampsora ricini|Albugo candida",0),

M("Alternaria blight of safflower is caused by","Alternaria ricini|Alternaria carthami|Alternaria brassicae|Alternaria helianthi",1),

S("List the major fungal, bacterial and viral diseases of rapeseed and mustard with causal organisms.",10,"Fungal: white rust (Albugo candida), club root (Plasmodiophora brassicae), Sclerotinia stem rot (Sclerotinia sclerotiorum), Alternaria blight (Alternaria brassicae), downy mildew (Peronospora parasitica), powdery mildew (Erysiphe polygoni). Bacterial: black rot/blight (Xanthomonas campestris pv. campestris). Viral: mosaic (Cauliflower/Rai/Turnip mosaic virus)."),

const sheet=document.getElementById("sheet"),tabs=document.querySelector(".tabs"),tog=document.getElementById("tog");
function render(k){
 const s=SETS[k];let h=`<div class="head"><h1>End Term Examination</h1><p>PTH313 · Diseases of Oilseed Crops (Unit 3) · Set ${k}</p><div class="meta"><span>Time: 3 hours</span><span>Maximum marks: 80</span></div></div>
 <div class="note">Section A: 30 multiple-choice questions, 1 mark each. Section B: answer all 5 questions, 10 marks each.</div><h2>Section A – Multiple choice (30 marks)</h2>`;
 s.mcq.forEach((m,i)=>{h+=`<div class="q"><div class="t"><span class="n">${i+1}.</span><span>${m.q}</span></div><ul class="opts">${m.o.map((o,j)=>`<li class="${j===m.a?"c":""}">(${L[j]}) ${o}</li>`).join("")}</ul><div class="key">Answer: (${L[m.a]}) ${m.o[m.a]}</div></div>`});
 h+=`<h2>Section B – Subjective (50 marks)</h2>`;
 s.sub.forEach((m,i)=>{h+=`<div class="q"><div class="t"><span class="n">Q${i+1}.</span><span>${m.q}</span><span class="marks">[${m.m}]</span></div><div class="key"><b>Model answer:</b> ${m.a}</div></div>`});
 sheet.innerHTML=h;
}
Object.keys(SETS).forEach((k,i)=>{const b=document.createElement("button");b.textContent="Set "+k;b.setAttribute("role","tab");b.setAttribute("aria-selected",i===0);b.onclick=()=>{tabs.querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",x===b));render(k);scrollTo(0,0)};tabs.appendChild(b)});
tog.onclick=()=>{const on=sheet.classList.toggle("show");tog.textContent=on?"Hide answers":"Show answers";tog.setAttribute("aria-pressed",on)};
render("A");
</script>
